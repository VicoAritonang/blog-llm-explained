    <noscript><main><h1>NeuroLab: Ikuti perjalanan satu token</h1><p>Teks dipisahkan menjadi token, lalu setiap ID mengambil baris embedding dan menambahkan posisi. Di setiap blok Transformer, LayerNorm diikuti proyeksi Query, Key, dan Value. Attention mencocokkan Q dengan K, menutup posisi masa depan, lalu memakai bobot softmax untuk mencampurkan V. Dua residual dan MLP dengan GELU memperbarui representasi. Final LayerNorm dan proyeksi vocabulary menghasilkan logits; greedy atau sampling memilih token berikutnya. KV cache menyimpan K/V prefix untuk langkah berikutnya.</p><p>Simulator edukasi dengan bobot mainan deterministik, bukan keluaran GPT-2 asli. Aktifkan JavaScript untuk eksperimen, angka, dan tur 3D.</p><a href="https://github.com/openai/gpt-2/blob/master/src/model.py">Implementasi GPT-2</a></main></noscript>
